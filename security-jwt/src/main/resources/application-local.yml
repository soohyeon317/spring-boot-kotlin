server:
  port: 5000

spring:
  config:
    activate:
      on-profile: local
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/~~~~~
#    url: r2dbc:mysql://localhost:3306/~~~~~?serverZoneId=Asia/Seoul&sslMode=DISABLED
#    url: r2dbc:mysql://host.docker.internal:3306/~~~~~?serverZoneId=Asia/Seoul&sslMode=DISABLED # Docker Container 실행 시 필요.
    username: ~~~~~
    password: ~~~~~
    pool:
      validation-query: SELECT 1
      initial-size: 2
      max-size: 50
      max-idle-time: 25s
      max-life-time: 30s

jwt:
  secret-key: "~~~~~"
  access-token-validity-in-seconds: 1800 # 30분
  refresh-token-validity-in-seconds: 1209600 # 14일

springdoc:
  default-consumes-media-type: application/json;charset=UTF-8
  default-produces-media-type: application/json;charset=UTF-8
  swagger-ui:
    path: swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  cache:
    disabled: true
  server-url: http://localhost:5000
